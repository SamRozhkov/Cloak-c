# Release pipeline: fires when a tag is pushed, runs the full test suite,
# builds ck-server and ck-client for Linux, and attaches the tarball to a
# GitHub Release named after the tag.
#
# Linux only, on purpose. A FreeBSD job was written and then removed
# (see the commit history of this file) because the tree cannot build
# there yet -- but the reason is narrower than that removal first
# claimed. It is two files: five epoll calls in
# libcloak-common/src/reactor.c and a 95-line
# libcloak-common/src/signals.c built on signalfd. Everything else is
# portable; see the README. Adding the platform back is a kqueue backend
# behind the reactor's existing interface, not a change to this file.
#
# WHY THERE ARE TWO BUILDS, AND WHY THEY ARE NOT THE SAME BUILD
# -------------------------------------------------------------
# Testing and shipping want opposite things from their environment here.
#
# The suite cannot run on a bare runner. Five of its tests put real Go on
# the far end -- that is the point of them, and it is how the AAD
# divergence was eventually caught after five modules of our-encoder-
# against-our-decoder tests missed it. test_ws_interop compiles a Go
# oracle against gorilla/websocket at BUILD time, and four more drive Go
# Cloak v2.12.0's own ck-client and ck-server as subprocesses at RUN
# time. Those tests fail loudly when the binaries are absent rather than
# skipping, which is correct and which is also why a bare `ubuntu-latest`
# turns them red. Dockerfile.dev exists to supply exactly that
# environment, and it is the environment every local verification of this
# project has used.
#
# The released binary must not come from there. That image is Debian 12,
# glibc 2.36, so anything built in it refuses to start on Ubuntu 22.04.
# The artefact is therefore built on the oldest supported runner, with
# -DCLOAK_REQUIRE_GO=OFF and only the two executables as targets -- no
# tests are compiled in that job at all, so it needs no Go and proves
# nothing, which is fine, because `test` has already proved it.

name: Release

on:
  push:
    tags:
      - "v*"
  # Lets you rehearse the whole pipeline on a branch without cutting a tag.
  # The release job is skipped unless the run was triggered by a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  test:
    name: Full suite (cloak-c-dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image installs clang, llvm, a Go toolchain and builds Go
      # Cloak's own binaries, so it is expensive to build and almost never
      # changes. The registry cache keeps that off the critical path of
      # every tag after the first.
      - name: Build the dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          tags: cloak-c-dev:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -j2 on a 4-core runner rather than -j4. Three wall-clock
      # assertions in this suite were fixed after failing only under CPU
      # starvation, and a hosted runner is a shared, oversubscribed
      # machine; leaving headroom costs about a minute. There is
      # deliberately no retry wrapper -- a red suite blocks the release.
      - name: Build and run the suite
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}":/src -w /src cloak-c-dev:latest \
            bash -c '
              set -eu
              cmake -S /src -B /tmp/build -DCMAKE_BUILD_TYPE=Debug
              cmake --build /tmp/build -j"$(nproc)"
              cd /tmp/build && ctest -j2 --output-on-failure
            '

  # ---------------------------------------------------------------------
  build-linux:
    name: Linux x86_64 binaries
    needs: [test]
    # Pinned to the oldest supported runner on purpose: the binaries link
    # glibc and OpenSSL dynamically, so building on 22.04 lets them run on
    # 22.04 and newer, while building on 24.04 would not run on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev

      # CLOAK_REQUIRE_GO=OFF drops test_ws_interop, whose Go oracle is
      # compiled at configure time and which is the only thing in the tree
      # that needs a toolchain to BUILD. Nothing is being tested in this
      # job, so nothing is lost: the target list below builds the two
      # executables and not one test.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLOAK_REQUIRE_GO=OFF \
            -DCLOAK_VERSION="${GITHUB_REF_NAME}"

      - name: Build
        run: cmake --build build -j"$(nproc)" --target ck-server ck-client

      - name: Package
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="cloak-c-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp build/cmd/ck-server/ck-server "dist/${PKG}/"
          cp build/cmd/ck-client/ck-client "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          strip "dist/${PKG}/ck-server" "dist/${PKG}/ck-client"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          (cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
          ls -l dist

      # Prints the version the binaries actually report and the libraries
      # they actually need, so the release notes' claims are checkable
      # against the run that produced the files.
      - name: Report what the binaries are
        run: |
          ./build/cmd/ck-server/ck-server -v
          ./build/cmd/ck-client/ck-client -v
          ldd build/cmd/ck-server/ck-server

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*.tar.gz*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List what is being published
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Binaries for `ck-server` and `ck-client`, built from ${{ github.ref_name }}.

            Verify a download against its `.sha256` file before running it.

            **Linux (x86_64)** — built on Ubuntu 22.04; glibc and OpenSSL are
            linked dynamically, so it runs on 22.04 and newer.

            Linux is the only platform for now: the reactor uses `epoll` and
            `signalfd`, so a FreeBSD or macOS build needs a `kqueue` backend
            first.
